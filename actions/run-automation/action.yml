name: Run Hiero SDK Automation
description: Run a shared Hiero SDK automation from sdk-automations.
inputs:
  automation:
    description: Automation name to run. Currently supports review-sync.
    required: true
  config-path:
    description: Path to the caller repository automation config.
    required: false
    default: .github/hiero-automation.yml
  github-token:
    description: GitHub token used for API calls.
    required: true
  dry-run:
    description: Log intended changes without mutating GitHub state.
    required: false
runs:
  using: node20
  main: dist/index.js
