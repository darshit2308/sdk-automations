name: Bot - On PR Open

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  on-pr-open:
    runs-on: hiero-client-sdk-linux-large
    if: github.event.pull_request.draft == false

    concurrency:
      group: pr-bot-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450
        with:
          egress-policy: audit

      - name: Checkout automation config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/hiero-automation.json
          sparse-checkout-cone-mode: false

      # Future interface example. PR-open automation is intentionally not implemented in the first pilot.
      - name: Run shared PR automation
        uses: hiero-hackers/sdk-automations/actions/run-automation@v0.1.0
        with:
          automation: pr-open
          config-path: .github/hiero-automation.json
          github-token: ${{ github.token }}
